name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# Match Test's private-repository concurrency group so the two internally
# parallel matrices do not saturate the same self-hosted machines. Public jobs
# keep a workflow-specific group because they run on GitHub-hosted runners.
concurrency:
  group: ${{ github.event.repository.visibility == 'public' && format('{0}-{1}', github.workflow, github.ref) || format('local-ci-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  central-policy:
    # Private repositories use the local Linux pool. Public repositories use
    # disposable hosted runners so fork pull requests cannot reach it.
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'aplexica-linux' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./tools/actionpin
      - run: go run ./tools/workflowpolicy

  reachable-vulnerabilities:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tags: ["", tray]
        include:
          - os: ubuntu-latest
            private_runner: aplexica-linux
          - os: macos-latest
            private_runner: aplexica-mac
          - os: windows-latest
            private_runner: aplexica-win
    runs-on: ${{ github.event.repository.visibility == 'public' && matrix.os || matrix.private_runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan reachable Go code
        shell: bash
        run: |
          if [[ -n "${{ matrix.tags }}" ]]; then
            go tool govulncheck -tags="${{ matrix.tags }}" ./...
          else
            go tool govulncheck ./...
          fi
