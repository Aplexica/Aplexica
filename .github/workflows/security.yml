name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# All jobs run on GitHub's disposable fleet, so each workflow gets its own
# per-ref group. cancel-in-progress stays false so a force-push cannot
# silently cancel a still-relevant run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  central-policy:
    # Disposable hosted runner: fork pull requests never reach anything
    # persistent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./tools/actionpin
      - run: go run ./tools/workflowpolicy

  reachable-vulnerabilities:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tags: ["", tray]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan reachable Go code
        shell: bash
        run: |
          if [[ -n "${{ matrix.tags }}" ]]; then
            go tool govulncheck -tags="${{ matrix.tags }}" ./...
          else
            go tool govulncheck ./...
          fi
