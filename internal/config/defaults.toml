# Aplexica shipped defaults — FR-10.7 / FR-10.11
#
# This file is the layer-1 source of truth for every tunable parameter.
# It is embedded into the binary at build time via go:embed; running the
# daemon, CLI, or tray with NO other config layers present MUST produce
# a working system using exactly these values.
#
# Override precedence (lowest → highest), per BRD-10 §10.1:
#
#   1. THIS FILE (shipped defaults)
#   2. /etc/aplexica/config.toml          (Unix system layer)
#      %PROGRAMDATA%\Aplexica\config.toml (Windows system layer)
#   3. ~/.aplexica/config.toml            (user layer)
#   4. <project-root>/.aplexica/config.toml (project layer, when active)
#   5. APLEXICA_<KEY>=<value> environment variables
#   6. --config-set <key>=<value> CLI flags
#
# Every parameter MUST carry an inline comment describing its purpose,
# units, valid range, and when to change it (FR-10.11). Adding a new
# tunable in source code MUST be paired with an entry here — the CI
# magic-number lint (FR-10.6) will fail the build if you forget.
#
# Key naming: dotted, lowercase, hyphens never. Subsystem.parameter shape.

[daemon]
# How often the daemon scans for project repos matching pending artifacts
# (BRD-02 §4.13.4). Set to "0s" to disable the periodic scan; users who
# explicitly `aplexica project link` won't notice. Tradeoff: longer
# intervals delay auto-materialization after `git clone`; shorter
# intervals burn more disk I/O walking the homedir tree.
# Units: Go duration. Range: 0s | 1m+ recommended. Default: 60m.
project_scan_interval = "60m"

# Maximum directory depth the scan descends below each root. Most user
# homedirs nest repos at depth 3 (e.g. ~/code/<org>/<repo>); 6 covers
# deeper monorepo layouts. Increase if you nest aggressively.
# Range: 1..16.
project_scan_max_depth = 6

# Comma-separated absolute paths that the scan walks. Empty list means
# the daemon falls back to pending.DefaultScanRoots() which is `$HOME`.
project_scan_roots = []

# Warm-up grace period after daemon start before the first project
# scan tick fires. Lets the orchestrator and initial reconciliation
# settle. Units: Go duration. Range: 0s..60s.
project_scan_warmup = "10s"

# Watcher debounce window: minimum quiet time between filesystem
# events before the daemon acts on a coalesced batch. Lower = more
# responsive sync; higher = fewer wasted re-imports during rapid
# editor "save on type" cycles. Units: Go duration. Range: 50ms..10s.
quiet_period = "500ms"

# Recursion-guard window: how long to suppress inbound events
# generated by an outbound write (loop prevention). Lower = faster
# release of legitimate user edits that follow our own writes;
# higher = stricter loop prevention but laggier UX. Units: Go
# duration. Range: 100ms..60s.
guard_window = "5s"

# How long a Claude Code transcript stays in the daemon's hot session poll set
# after it is imported locally or materialized from another device. This keeps
# bidirectional resume/continue sync under the live-sync target without walking
# the whole ~/.claude/projects history twice per second.
# Units: Go duration. Range: 1m..60m.
claude_session_scan_window = "15m"


[limits]
# Maximum size of a single native artifact file the daemon will ingest
# (BRD-03 §4.3 / §5). A watched file larger than this is refused BEFORE
# parse/canonical-encode — surfaced as an artifact.refused event (throttled
# per file) and a status warning — so a runaway blob cannot blow up the
# store. Agent session transcripts (Claude Code / Codex JSONL) are governed
# by max_session_file_mb below instead of this cap. Set -1 to disable the
# cap entirely. CAUTION before raising it for conversations: canonical
# replication is lossless and cloud events currently carry full-state
# payloads, so files above the outbound transport's practical ceiling still
# cannot cross devices — see the large-session sync design notes.
# Units: MB (int). Range: -1..10240.
max_artifact_size_mb = 64

# Maximum size of a single agent session transcript the daemon will ingest —
# paths under Claude Code's ~/.claude/projects/ and Codex's ~/.codex/sessions/.
# Session transcripts are append-mostly conversation logs that legitimately
# outgrow the generic artifact cap (multi-week sessions reach hundreds of MB),
# and aligned-chain sync replicates them across devices as per-turn deltas, so
# admitting them is normal operation — hence the separate, larger cap. Files
# that are not session transcripts keep max_artifact_size_mb. Lower it to
# bound store growth from huge transcripts; set -1 to disable this cap.
# Units: MB (int). Range: -1..10240.
max_session_file_mb = 512


[retention]
# Minimum events on an artifact's chain before a snapshot becomes
# eligible (BRD-03 §4.8.2). Lower = more snapshots, smaller per-snapshot
# replay cost, more storage. Higher = fewer snapshots, larger replay
# windows. Range: 10..10000.
snapshot_min_events = 100

# Minimum age of the artifact's HEAD event before a snapshot is taken.
# Pairs with snapshot_min_events as an AND condition.
# Units: Go duration. Range: 1h..30d.
snapshot_min_age = "7d"

# Pre-snapshot events to keep in the on-disk log after pruning. Acts
# as a tail-buffer for replay debugging.
# Range: 0..1000.
prune_keep_tail = 10

# ── Disk-pressure / attachment-eviction policy (BRD-03 §4.8.4) ──

# Hard cap on the canonical store's on-disk size. Purpose: bound disk
# usage so the engine can shed old data before the volume fills.
# Units: gigabytes (float). Range: 0..10000. Default 0 = unlimited (no
# disk-pressure trigger, no emergency ingest refusal). Set a finite cap
# only together with a finite keep_last_n_snapshots: with the shipped
# keep-all policy the pressure sweep cannot reclaim anything, so a cap can
# only escalate to refusing ingestion. BRD-03 §4.8.4 specifies 10.
store_max_gb = 0

# Fraction of store_max_gb at which emergency pruning kicks in
# (force-snapshot every artifact, then prune aggressively). Purpose:
# start reclaiming space before the store is full. Units: fraction
# (0..1, float). Range: 0..1. When to change: lower it to reclaim
# earlier (more snapshot/prune churn); raise it to defer. No effect
# when store_max_gb = 0.
store_high_watermark = 0.80

# Fraction of store_max_gb above which the engine refuses NEW ingestion
# (rare, last-resort). Purpose: hard backstop so a runaway import can't
# fill the disk. Units: fraction (0..1, float). Range: 0..1, and MUST
# be >= store_high_watermark. When to change: raise toward 1.0 to allow
# more headroom before refusal; never set below the watermark.
store_emergency_quota = 0.95

# Eviction mode at the watermark. Purpose: choose what to shed first.
# true (OSS default) evicts only attachment bytes (Base64 blobs) and
# keeps conversation text fully readable; false falls back to full
# event pruning. Units: bool. When to change: set false only if you
# require full-fidelity attachment retention and accept text pruning
# instead (read BRD-03 §4.8.3 first).
attachments_only = true

# Attachments younger than this are protected from eviction. Purpose:
# never evict recently-created images a user is still actively viewing.
# Units: days (int). Range: 0..3650. When to change: raise to protect
# attachments longer; lower to reclaim attachment bytes sooner.
attachment_min_age_days = 30

# How many most-recent snapshots to retain per artifact. Purpose: bound
# snapshot storage. Units: int or the literal "all". Range: "all" or an int
# >= 2 (floor). When to change: "all" (default) keeps every snapshot and
# disables pre-snapshot history compaction; an integer caps retained snapshots
# (FR-03.25) — once an artifact exceeds N snapshots, older snapshot history is
# compacted out of the active log, anchored at the Nth-most-recent snapshot.
keep_last_n_snapshots = "all"

# Artifacts carrying any of these tags are exempt from ALL pruning and
# eviction. Purpose: let users pin data they never want shed. Units:
# string array. When to change: add your own conventional pin tags;
# the defaults cover the documented "pinned" / "keep-forever" tags.
pin_tags = ["pinned", "keep-forever"]

# Per-kind snapshot cadence by event count (overrides the §4.8.1
# defaults). Purpose: take a snapshot once an artifact's chain reaches
# this many events. Units: events (int). Range: 1..100000. When to
# change: lower for smaller replay windows at the cost of more
# snapshots; raise to snapshot less often. Conversations churn fastest,
# hence the higher threshold.
snapshot_after_events.conversation = 100
snapshot_after_events.memory = 50
snapshot_after_events.skill = 50
snapshot_after_events.tool = 50

# Per-kind snapshot cadence by HEAD age (AND-paired with the event
# count). Purpose: snapshot a long-idle artifact even if it never hit
# the event threshold. Units: Go duration. Range: 1h..365d. When to
# change: shorten to snapshot idle artifacts sooner; lengthen to defer.
snapshot_after_time.conversation = "24h"
snapshot_after_time.memory = "7d"
snapshot_after_time.skill = "7d"
snapshot_after_time.tool = "7d"


[tray]
# Tray status indicator refresh cadence. The tray polls the daemon's
# status socket at this interval and redraws the menu. Lower = snappier
# UI, more daemon round-trips per minute. Higher = laggier "conflicts"
# / "pending" counts.
# Units: Go duration. Range: 1s..30s.
refresh_interval = "5s"

# How long after the last filesystem event before the tray switches
# from "active" back to "idle". The tray's StateActive lasts at most
# this long after the daemon reports a fresh event.
active_window = "60s"

# Threshold after which the tray badges "paused" rather than "idle"
# (no activity for this long suggests the daemon isn't doing useful
# work and the user may want to know).
paused_window = "10m"


[conflicts]
# Per-artifact retention of conflict-detection records. Conflict
# records older than this age are eligible for garbage collection
# the next time the daemon prunes its conflict log.
# Units: Go duration. Range: 1d..90d.
ttl = "30d"


[branches]
# Auto-archive branches whose most recent event is older than this
# many days (BRD-04 §4.3.1 / FR-04.14). The daemon's daily
# lifecycle pass walks every artifact's branch index and flips the
# `archived` flag on stale branches. Archival is metadata-only — no
# events are deleted, and archived branches remain visible via
# `aplexica branch list --include-archived`.
# Set to 0 to disable auto-archival entirely.
# Units: days. Range: 0..3650.
auto_archive_after_days = 90

# How often the daemon runs the auto-archive lifecycle pass.
# Units: Go duration. Range: 5m..7d.
auto_archive_interval = "24h"


[metrics]
# Enable the Prometheus /metrics endpoint (BRD-03 FR-03.14 / FR-10.4).
# Off by default — operators opt in by setting this to true.
enabled = false

# host:port for the metrics endpoint. FR-10.4 mandates loopback-only
# by default; binding to a non-loopback address is the operator's
# explicit choice. Range: host:port pair.
listen = "127.0.0.1:9090"


[secrets]
# Default value of `syncSecrets` on newly-imported tool artifacts
# (FR-02.16). The shipped default is `false` — configs sync, secrets
# stay local — per the BRD's "least-leakage" stance. Override to
# `true` only after reading the trust-model implications in
# 09-security-and-trust-model.md.
default_sync_secrets = false


[bundle]
# Default bundle filename when `aplexica backup` is invoked without
# an explicit path. The literal "{date}" placeholder is substituted
# with the current local date in YYYY-MM-DD shape.
default_filename = "aplexica-backup-{date}.tar.gz"

# Default compression level for bundle export. 1=fastest/largest,
# 9=slowest/smallest. The Go gzip default (6) balances both.
# Range: 1..9.
compression_level = 6


[log]
# How many rotated log files the daemon keeps before deleting the
# oldest (FR-10.3). Range: 1..365.
rotate_keep = 30

# When the daemon rotates its log files. "midnight-local" is the
# documented FR-10.3 behavior; "midnight-utc" is offered for
# operators who run multi-region deployments.
rotate_at = "midnight-local"

# How many bytes of the most recent log to include in
# `aplexica doctor` diagnostic reports (FR-10.2). Smaller = less
# context for support; larger = more chance of bumping the 5 MB
# report cap. Range: 1024 (1 KiB) .. 1048576 (1 MiB).
doctor_tail_bytes = 65536


# ──────────────────────────────────────────────────────────────────
# Section [_meta] is reserved for the config tooling itself. Do not
# add tunables here — `aplexica config validate` may special-case it.
# ──────────────────────────────────────────────────────────────────

[_meta]
# Bumped whenever the defaults schema gains a new key or changes a
# semantic in a way that user-layer files might reference. Increment
# in lockstep with the binary release that introduces the change.
schema_version = 7
