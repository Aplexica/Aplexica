# Aplexica string catalog — en-US baseline (FR-03.31 v1).
#
# Every key is flat (no nested TOML tables) so the loader can decode
# straight into map[string]string. Keys are stable identifiers that
# code consumes via i18n.T()/Tf(); values are user-facing strings.
#
# Add new locales by dropping <locale>.toml next to this file (e.g.,
# `de-DE.toml`, `ja-JP.toml`). Missing keys in a non-en-US catalog
# fall back to en-US automatically; missing keys everywhere render
# as ⟨key⟩ for visual debugging.
#
# Naming convention: <area>_<purpose>. Areas:
#   tray_menu_*        — main tray menu item labels
#   tray_tooltip_*     — tooltips on menu items
#   tray_status_*      — status-header label fragments
#   tray_state_*       — TrayState.String() values
#   tray_about_*       — modal About dialog content
#   tray_conflict_*    — per-conflict submenu strings
#   cmd_tray_*         — `aplexica tray install/uninstall` CLI output

